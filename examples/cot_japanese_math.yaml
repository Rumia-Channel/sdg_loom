# 日本語・算数/数学 文章題データセット生成パイプライン
# 通常版: キャラクターロールプレイを含めず、中立的な数学解法データを生成する。
#
# 実行例:
#   sdg test-run --yaml examples/cot_japanese_math.yaml --input examples/data/cot_japanese_math_seeds.jsonl
#   sdg run --yaml examples/cot_japanese_math.yaml --input examples/data/cot_japanese_math_scaled_seeds.jsonl --output japanese_math_cot.jsonl --adaptive --max-batch 8 --target-latency-ms 2000 --use-shared-transport --resume
#
# キャラクター付きの「自信家な僕っ娘」版は examples/cot_japanese_math_boku.yaml を使う。

mabel:
  version: "2.0"
  id: "com.example.cot_japanese_math"
  name: "日本語 数学推論データセット生成器 (通常版)"
  description: |
    前提知識を段階的に積み上げる日本語の算数・数学データセットを生成する。
    こちらは通常版であり、特定の人格・一人称・ロールプレイ口調は入れない。
    誤答訂正、正答確認、下位概念からの説明も中立的な教師口調で扱う。

globals:
  const:
    APP_NAME: "日本語 数学推論データセット生成器"

  vars:
    problem: ""
    cot_solution: ""
    final_answer: ""

budgets:
  ai:
    max_calls: 200
    max_tokens: 1000000
  wall_time_ms: 7200000

models:
  - name: math_solver
    api_model: "${ENV.SDG_API_MODEL}"
    api_key: "${ENV.SDG_API_KEY}"
    base_url: "${ENV.SDG_BASE_URL}"
    request_defaults:
      # DeepSeek 推奨: SDG_API_MODEL=deepseek-v4-pro, SDG_API_KEY=sk-..., SDG_BASE_URL=https://api.deepseek.com
    request_defaults:
      temperature: 0.3
      max_tokens: 8192
      top_p: 0.95

blocks:
  - type: logic
    exec: 1
    id: init
    name: "変数初期化"
    op: set
    var: iteration
    value: 0
    outputs:
      - name: Iteration
        from: value

  - type: ai
    exec: 10
    id: generate_problem
    name: "日本語文章題の生成"
    model: math_solver
    system_prompt: |
      あなたは数学教材向けの文章題を作成する専門家です。
      与えられた seed をもとに、条件が明確で、答えが一意に定まる日本語の文章題を1つ作成してください。

      # 基本方針
      - 出力はすべて日本語にする。
      - 数式は必要な箇所だけ $...$ で書く。
      - 問いは1つに絞り、条件不足や複数解を避ける。
      - 「Level」「Step」「内部難易度」などのメタ情報を問題文に入れない。
      - seed の場面は素材として使い、同じ数値・同じ対象物・同じ問い方をそのまま繰り返さない。

      # 段階的な知識制約
      内部難易度1は数学の出発点であり、前提知識を要求しない。
      内部難易度2以降は、それ以前の範囲の考え方を自然に使うようにする。
      ただし、未導入の強い道具を近道として要求する問題にはしない。

      # 解法制約
      - allowed_methods が与えられている場合、その範囲の知識だけで自然に解ける問題にする。
      - forbidden_methods が与えられている場合、その知識を使わないと自然に解けない問題にしない。
      - 導入済みの概念で直接扱える問題を、未導入の上位概念へ持ち上げない。

      # 多様化
      scaled seed では、問題タイプ・表層テーマ・条件焦点・数値方針・多様化ヒントが渡されることがある。
      それらは重複を避けるための指示として使う。
      ただし、指定された単元と導入概念から外れない。

      # 出力形式
      <problem>
      [日本語の文章題。場面、条件、問いを簡潔に含める。]
      </problem>
      <topic>
      [単元名]
      </topic>
      <prerequisites_used>
      [解答で実際に使う既習事項。ない場合は「なし」。]
      </prerequisites_used>
    prompts:
      - |
        以下の seed をもとに、数学の日本語文章題を作成してください。

        【内部難易度番号】 {level}
        【対象学年】 {grade}
        【新規導入概念】 {new_concept}
        【既習事項】 {prerequisites}
        【単元・分野】 {topic}
        【seed の場面メモ】 {scenario}

        【生成シナリオ】 {interaction_label}
        【シナリオ指示】 {interaction_instruction}
        【学習者プロフィール】 {learner_profile}
        【多様化ヒント】 {variation_hint}
        【数値設定方針】 {number_policy}
        【問題タイプ】 {problem_archetype}
        【表層テーマ】 {surface_theme}
        【条件焦点】 {constraint_focus}
        【想定誤答パターン】 {wrong_answer_pattern}
        【許可知識】 {allowed_methods}
        【禁止知識】 {forbidden_methods}
        【解法ポリシー】 {method_policy}
        【追加多様化指示】 {diversity_instruction}

        キャラクター口調や一人称は使わず、通常の数学教材として自然な問題にしてください。
    outputs:
      - name: Problem
        select: tag
        tag: problem
      - name: ProblemTopic
        select: tag
        tag: topic
      - name: PrerequisitesUsed
        select: tag
        tag: prerequisites_used
    save_to:
      vars:
        problem: Problem

  - type: ai
    exec: 20
    id: generate_solution
    name: "通常版の解答ログ生成"
    model: math_solver
    system_prompt: |
      あなたは日本語の数学解法データを作る教師です。
      特定のキャラクター、ロールプレイ、一人称、口癖を使わず、中立的で自然な解答ログを書いてください。

      # 解答ログの方針
      - すべて日本語で書く。
      - 数式は必要な箇所だけ $...$ で書く。
      - 「Step」「Level」「内部難易度」などのメタ表現を使わない。
      - 解法は allowed_methods の範囲に収め、forbidden_methods を近道として使わない。
      - 簡単な問題は素直に短く解く。
      - 条件確認や検算が必要な問題では、式、単位、整数条件、最大・最小、境界値を確認する。
      - 答えだけを出さず、問いへの答えとして必要な計算過程と理由を残す。
      - <answer> は単独で読める簡潔な最終回答にする。途中の迷い、フィラー、自己修正は入れない。

      # シナリオ別の扱い
      - direct_solution: 問題をそのまま解く。<learner_response> は空欄にする。
      - wrong_answer_correction: もっともらしい誤答を <learner_response> に書き、解答ログでは明確に否定して理由を説明する。
      - correct_answer_verification: 正しい答えを <learner_response> に書き、解答ログでは計算と検算で正しいことを確認する。
      - prerequisite_bridge_teaching: 一つ下の範囲の考え方から新しい概念へ橋渡しして説明する。

      # 出力形式
      <learner_response>
      [シナリオに応じた学習者の発言。direct_solution では空欄。]
      </learner_response>
      <cot>
      [自然な日本語の解答ログ。必要な条件確認、計算、検算を含める。]
      </cot>
      <answer>
      [問いへの最終回答。答えだけでなく、必要な計算・条件確認・単位を簡潔に含める。]
      </answer>
    prompts:
      - |
        次の問題を、通常の数学解法データとして解いてください。

        【問題】
        {Problem}

        【単元】 {ProblemTopic}
        【実際に使う既習事項】 {PrerequisitesUsed}
        【新規導入概念】 {new_concept}
        【既習事項】 {prerequisites}
        【生成シナリオ】 {interaction_type}
        【シナリオ指示】 {interaction_instruction}
        【学習者プロフィール】 {learner_profile}
        【想定誤答パターン】 {wrong_answer_pattern}
        【許可知識】 {allowed_methods}
        【禁止知識】 {forbidden_methods}
        【解法ポリシー】 {method_policy}

        キャラクター性、一人称、得意げな口調は入れないでください。
        ただし、人間が読む解答として自然で、問いに対して正しい説明になるようにしてください。
    outputs:
      - name: LearnerResponse
        select: tag
        tag: learner_response
      - name: CoTSolution
        select: tag
        tag: cot
      - name: FinalAnswer
        select: tag
        tag: answer
    save_to:
      vars:
        cot_solution: CoTSolution
        final_answer: FinalAnswer

  - type: python
    exec: 30
    id: validate_and_format
    name: "検証と最終整形"
    entrypoint: validate_and_format
    function_code: |
      import json
      import re

      def validate_and_format(
          ctx,
          level: str,
          grade: str,
          new_concept: str,
          prerequisites: str,
          topic: str,
          scenario: str,
          sample_id: str,
          source_seed_index: str,
          level_item_index: str,
          variant_index: str,
          interaction_type: str,
          interaction_label: str,
          interaction_instruction: str,
          learner_profile: str,
          variation_hint: str,
          number_policy: str,
          problem_archetype: str,
          surface_theme: str,
          constraint_focus: str,
          wrong_answer_pattern: str,
          diversity_instruction: str,
          allowed_methods: str,
          forbidden_methods: str,
          method_policy: str,
          problem: str,
          learner_response: str,
          cot_solution: str,
          answer: str,
          problem_topic: str,
          prereqs_used: str,
      ) -> dict:
          problem = (problem or "").strip()
          learner_response = (learner_response or "").strip()
          cot_solution = (cot_solution or "").strip()
          answer = (answer or "").strip()
          problem_topic = (problem_topic or topic or "").strip()
          prereqs_used = (prereqs_used or "").strip()

          full_text = "\n".join([problem, learner_response, cot_solution, answer])
          warnings = []

          japanese_valid = bool(re.search(r"[\u3040-\u30ff\u3400-\u9fff]", full_text))
          if not japanese_valid:
              warnings.append("Japanese text was not detected")

          inline_dollar = full_text.count("$")
          found_commands = sorted(set(re.findall(r"\\[A-Za-z]+", full_text)))
          latex_valid = inline_dollar == 0 or inline_dollar >= 2
          if not latex_valid:
              warnings.append("LaTeX delimiter count looks incomplete")

          forbidden_meta = ["Step", "STEP", "Level", "LEVEL", "内部難易度", "style_intensity", "persona"]
          found_meta = [term for term in forbidden_meta if term in full_text]
          meta_expression_valid = not found_meta
          if found_meta:
              warnings.append("Meta expressions found: " + ", ".join(found_meta))

          answer_marker_valid = bool(answer)
          if not answer_marker_valid:
              warnings.append("Final answer is empty")

          answer_support_valid = len(answer) >= 12 and any(ch.isdigit() for ch in answer + cot_solution)
          if not answer_support_valid:
              warnings.append("Final answer may be too short or unsupported")

          roleplay_terms = ["僕", "ふふん", "僕に任せて", "してあげる", "当然だね"]
          found_roleplay = [term for term in roleplay_terms if term in full_text]
          neutral_tone_valid = not found_roleplay
          if found_roleplay:
              warnings.append("Roleplay expressions found: " + ", ".join(found_roleplay))

          forbidden_terms = [
              term.strip()
              for term in re.split(r"[、,]", forbidden_methods or "")
              if term.strip()
          ]
          used_forbidden = []
          for term in forbidden_terms:
              if term and term in cot_solution:
                  used_forbidden.append(term)
          method_policy_valid = not used_forbidden
          if used_forbidden:
              warnings.append("Forbidden method terms found in solution: " + ", ".join(used_forbidden[:8]))

          output = {
              "problem": problem,
              "answer": answer,
              "cot_solution": cot_solution,
              "learner_response": learner_response,
              "topic": problem_topic,
              "prerequisites_used": prereqs_used,
              "level": level,
              "grade": grade,
              "new_concept": new_concept,
              "prerequisites": prerequisites,
              "scenario": scenario,
              "sample_id": sample_id,
              "source_seed_index": source_seed_index,
              "level_item_index": level_item_index,
              "variant_index": variant_index,
              "interaction_type": interaction_type or "direct_solution",
              "interaction_label": interaction_label,
              "learner_profile": learner_profile,
              "variation_hint": variation_hint,
              "number_policy": number_policy,
              "problem_archetype": problem_archetype,
              "surface_theme": surface_theme,
              "constraint_focus": constraint_focus,
              "wrong_answer_pattern": wrong_answer_pattern,
              "diversity_instruction": diversity_instruction,
              "allowed_methods": allowed_methods,
              "forbidden_methods": forbidden_methods,
              "method_policy": method_policy,
              "validation": {
                  "latex_valid": latex_valid,
                  "japanese_valid": japanese_valid,
                  "answer_marker_valid": answer_marker_valid,
                  "answer_support_valid": answer_support_valid,
                  "neutral_tone_valid": neutral_tone_valid,
                  "meta_expression_valid": meta_expression_valid,
                  "method_policy_valid": method_policy_valid,
                  "latex_dollar_count": inline_dollar,
                  "latex_command_count": len(found_commands),
                  "warnings": warnings,
              },
          }

          return {
              "OutputJSON": json.dumps(output, ensure_ascii=False),
              "OutputData": output,
              "Topic": problem_topic,
              "LatexValid": latex_valid,
              "JapaneseValid": japanese_valid,
              "AnswerMarkerValid": answer_marker_valid,
              "AnswerSupportValid": answer_support_valid,
              "NeutralToneValid": neutral_tone_valid,
              "MetaExpressionValid": meta_expression_valid,
              "MethodPolicyValid": method_policy_valid,
              "LatexDollarCount": inline_dollar,
              "LatexCommandCount": len(found_commands),
              "Warnings": warnings,
              "WarningCount": len(warnings),
          }
    inputs:
      level: "{level}"
      grade: "{grade}"
      new_concept: "{new_concept}"
      prerequisites: "{prerequisites}"
      topic: "{topic}"
      scenario: "{scenario}"
      sample_id: "{sample_id}"
      source_seed_index: "{source_seed_index}"
      level_item_index: "{level_item_index}"
      variant_index: "{variant_index}"
      interaction_type: "{interaction_type}"
      interaction_label: "{interaction_label}"
      interaction_instruction: "{interaction_instruction}"
      learner_profile: "{learner_profile}"
      variation_hint: "{variation_hint}"
      number_policy: "{number_policy}"
      problem_archetype: "{problem_archetype}"
      surface_theme: "{surface_theme}"
      constraint_focus: "{constraint_focus}"
      wrong_answer_pattern: "{wrong_answer_pattern}"
      diversity_instruction: "{diversity_instruction}"
      allowed_methods: "{allowed_methods}"
      forbidden_methods: "{forbidden_methods}"
      method_policy: "{method_policy}"
      problem: "{Problem}"
      learner_response: "{LearnerResponse}"
      cot_solution: "{CoTSolution}"
      answer: "{FinalAnswer}"
      problem_topic: "{ProblemTopic}"
      prereqs_used: "{PrerequisitesUsed}"
    outputs:
      [OutputJSON, OutputData, Topic, LatexValid, JapaneseValid, AnswerMarkerValid, AnswerSupportValid, NeutralToneValid, MetaExpressionValid, MethodPolicyValid, LatexDollarCount, LatexCommandCount, Warnings, WarningCount]
    ctx_access: ["vars.read", "log"]

  - type: end
    exec: 100
    reason: "japanese_math_generation_completed"
    exit_code: "success"
    final:
      - name: level
        value: "{level}"
      - name: grade
        value: "{grade}"
      - name: new_concept
        value: "{new_concept}"
      - name: prerequisites
        value: "{prerequisites}"
      - name: prerequisites_used
        value: "{PrerequisitesUsed}"
      - name: sample_id
        value: "{sample_id}"
      - name: source_seed_index
        value: "{source_seed_index}"
      - name: level_item_index
        value: "{level_item_index}"
      - name: variant_index
        value: "{variant_index}"
      - name: interaction_type
        value: "{interaction_type}"
      - name: interaction_label
        value: "{interaction_label}"
      - name: learner_profile
        value: "{learner_profile}"
      - name: learner_response
        value: "{LearnerResponse}"
      - name: variation_hint
        value: "{variation_hint}"
      - name: number_policy
        value: "{number_policy}"
      - name: problem_archetype
        value: "{problem_archetype}"
      - name: surface_theme
        value: "{surface_theme}"
      - name: constraint_focus
        value: "{constraint_focus}"
      - name: wrong_answer_pattern
        value: "{wrong_answer_pattern}"
      - name: diversity_instruction
        value: "{diversity_instruction}"
      - name: allowed_methods
        value: "{allowed_methods}"
      - name: forbidden_methods
        value: "{forbidden_methods}"
      - name: method_policy
        value: "{method_policy}"
      - name: problem
        value: "{Problem}"
      - name: cot_solution
        value: "{CoTSolution}"
      - name: answer
        value: "{FinalAnswer}"
      - name: topic
        value: "{Topic}"
      - name: scenario
        value: "{scenario}"
      - name: latex_valid
        value: "{LatexValid}"
      - name: japanese_valid
        value: "{JapaneseValid}"
      - name: answer_marker_valid
        value: "{AnswerMarkerValid}"
      - name: answer_support_valid
        value: "{AnswerSupportValid}"
      - name: neutral_tone_valid
        value: "{NeutralToneValid}"
      - name: meta_expression_valid
        value: "{MetaExpressionValid}"
      - name: method_policy_valid
        value: "{MethodPolicyValid}"
      - name: latex_dollar_count
        value: "{LatexDollarCount}"
      - name: latex_command_count
        value: "{LatexCommandCount}"
      - name: warning_count
        value: "{WarningCount}"
      - name: warnings
        value: "{Warnings}"
      - name: output_json
        value: "{OutputJSON}"
    final_mode: "map"
