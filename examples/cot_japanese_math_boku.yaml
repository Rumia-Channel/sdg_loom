    outputs:
      [OutputJSON, OutputData, Topic, Persona, StyleIntensity, CognitiveStyle, LatexValid, JapaneseValid, AnswerMarkerValid, AnswerSupportValid, AnswerToneValid, MetaExpressionValid, MethodPolicyValid, LatexDollarCount, LatexCommandCount, Warnings, WarningCount]
    ctx_access: ["vars.read", "log"]

