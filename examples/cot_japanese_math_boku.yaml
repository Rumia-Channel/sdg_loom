      prereqs_used: "{PrerequisitesUsed}"
    outputs:
      [
        OutputJSON,
        OutputData,
        Topic,
        Persona,
        StyleIntensity,
        CognitiveStyle,
        ProblemValid,
        LatexValid,
        CoTLatexValid,
        AnswerLatexValid,
        JapaneseValid,
