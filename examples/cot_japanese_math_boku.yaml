        - 問題の条件がこの制約に合わない場合は、無理に二桁計算や未知数式へ進まない

        【内部制約の非表示】
        - 内部難易度、Level、レベル制約、使用してよい知識、使ってはいけない知識、禁止知識、method_policy などのメタ情報は、<cot> と <answer> に絶対に書かない
        - これらは内部的に守るだけでよい
        - 「内部難易度が1だから」「Level 1だから」「使用してよい知識は〜」「禁止されているから使わない」「一桁の範囲に収まるから問題ない」のような説明も書かない
        - 読者には、通常の算数・数学解説として自然に見える文章だけを出力する

        【<answer> の追加制約】
        - <answer> は問いへの最終回答として単独で読める文にする
        - <answer> にはフィラー、迷い、自己修正、途中の独り言を入れない
        - <answer> でもキャラクターの口調を維持する
        - <answer> が急に無人格な模範解答口調や「〜である」調にならないようにする
        - <answer> には答えだけでなく、必要な計算・条件確認・検算・単位をできるだけ残す
        - <answer> の計算式は必ず LaTeX 記法で書く
        - <answer> では語尾だけでなく、「まず注目すべき点は」「ここで見るべきなのは」「僕はここを〜と見る」「確認すると」「だから答えは」などの判断構文を自然に含める
        - style_intensity が 2 以上なら、<answer> に「僕は〜と見る」「僕の確認では」などの一人称・判断主体をできるだけ含める
        - 「僕なら、まず〜を見るよ」のような定型的で不自然な出だしを使わない
        - 最大・最小問題の <answer> では、採用した値が条件を満たすことと、隣接値が条件に合わないことも短く示す
        - 「答えは3度だよ。」だけのような短すぎる回答にしない

        【シナリオ制約】
        - <learner_response> はシナリオに合わせて必ず出力する
        - direct_solution では <learner_response> を「なし」にする
        - wrong_answer_correction では、学習者の誤答を明確に否定したうえで教える
        - correct_answer_verification では、学習者の正答が合っていることを確認し、検算で確かめる
        - prerequisite_bridge_teaching では、一つ下の範囲から新しい概念へ丁寧につなげる
        - 最終的な答えには「答え:」または $\boxed{}$ を付ける
    outputs:
      - name: LearnerResponse
        select: tag
        tag: learner_response
      - name: CoTSolution
        select: tag
        tag: cot
      - name: FinalAnswer
        select: tag
        tag: answer
    save_to:
      vars:
        cot_solution: CoTSolution
        final_answer: FinalAnswer

  # ============================================================
  # 出力検証と整形
  # ============================================================
  - type: python
    exec: 30
    id: validate_and_format
    name: "検証と最終整形"
    entrypoint: validate_and_format
    function_code: |
      import json
      import re

      def validate_and_format(
          ctx,
          level: str,
          grade: str,
          new_concept: str,
          prerequisites: str,
          topic: str,
          scenario: str,
          style_intensity: str,
          sample_id: str,
          source_seed_index: str,
          level_item_index: str,
          variant_index: str,
          interaction_type: str,
          interaction_label: str,
          interaction_instruction: str,
          learner_profile: str,
          variation_hint: str,
          number_policy: str,
          problem_archetype: str,
          surface_theme: str,
          constraint_focus: str,
          wrong_answer_pattern: str,
          diversity_instruction: str,
          allowed_methods: str,
          forbidden_methods: str,
          method_policy: str,
          problem: str,
          learner_response: str,
          cot_solution: str,
          answer: str,
          problem_topic: str,
          prereqs_used: str,
      ) -> dict:
          """日本語の人格付き数学解答ログ出力の検証と整形"""

          problem = (problem or "").strip()
          learner_response = (learner_response or "").strip()
          cot_solution = (cot_solution or "").strip()
          answer = (answer or "").strip()

          interaction_type = (interaction_type or "direct_solution").strip()
          interaction_label = (interaction_label or "通常解答").strip()
          learner_profile = (learner_profile or "").strip()
          allowed_methods = (allowed_methods or "").strip()
          forbidden_methods = (forbidden_methods or "").strip()
          method_policy = (method_policy or "").strip()

          if not learner_response and interaction_type == "direct_solution":
              learner_response = "なし"

          try:
              level_num = int(level or "1")
          except (ValueError, TypeError):
              level_num = 1

          try:
              style_intensity_num = int(style_intensity or "2")
          except (ValueError, TypeError):
              style_intensity_num = 2

          persona = "自信家な僕っ娘。知的で得意げ。相手を見下さず、条件と計算で誤りを教えて導く。"
          cognitive_style = {
              "first_person": "僕",
              "stance": "条件確認・計算・検算に基づいて自分の判断に自信を持つ",
              "teaching_mode": "少し上からだが親切。誤りは明確に否定し、どこを直せばよいか教える",
              "tone": [
                  "得意げ",
                  "知的",
                  "少し上からだが攻撃的ではない",
                  "条件を見抜いて教えてあげる余裕がある",
              ],
              "reasoning_bias": [
                  "条件を正確に読む",
                  "聞かれている量を確認する",
                  "使用してよい知識の範囲で解法を選ぶ",
                  "未導入の記号化や上位概念に持ち上げず、導入済みの範囲で説明する",
                  "不等号・整数条件・単位を確認する",
                  "境界値を確認する",
                  "1つ上・1つ下の値も必要なら試す",
                  "差分や検算で自分の結論を確かめる",
              ],
              "answer_voice_contract": {
                  "description": "answer でも語尾だけでなく、自然な判断主体・条件確認・検算・自信ある結論を残す",
                  "required_groups_style_1": 2,
                  "required_groups_style_2": 3,
                  "required_groups_style_3_or_4": 4,
              },
              "problem_latex_policy": {
                  "required": False,
                  "description": "問題文は自然表記可。複雑な式を問題文に出す場合だけ LaTeX を使う。",
              },
              "solution_latex_policy": {
                  "cot_required": True,
                  "answer_required": True,
                  "description": "解答ログと最終回答の計算式は LaTeX 必須。",
              },
              "correction_protocol": [
                  "明確な否定",
                  "間違っている理由",
                  "実際の計算",
                  "条件違反の指摘",
                  "必要なら差分による修正",
                  "正しい答え",
              ],
              "avoid": [
                  "過剰な芝居",
                  "数学より口癖を優先する",
                  "文頭に機械的な一人称の定型句を置く",
                  "僕なら、まず聞かれている量を見るよ。",
                  "僕なら、まず条件を見るよ。",
                  "相手を馬鹿にする",
                  "根拠なしに断言する",
                  "誤答に対して自己アピールだけで返す",
                  "ふふん、そこは僕がちゃんと見てるよ。",
                  "そこは見落とさないよ。",
                  "僕はちゃんと分かってるよ。",
                  "僕に任せて。",
              ],
          }

          warnings = []

          combined_response = f"{learner_response}\n{cot_solution}\n{answer}"

          def has_any(text, markers):
              return [marker for marker in markers if marker in text]

          def has_regex(text, patterns):
              return [pattern for pattern in patterns if re.search(pattern, text)]

          def count_latex_dollars(text):
              return text.count("$")

          def has_japanese_chars(text):
              return bool(re.search(r'[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]', text or ""))

          def extract_plain_integers(text):
              """
              英数字や _ - に連結していない単純な整数を抽出する。
              sample_id 等は渡さない前提で使う。
              """
              return [
                  int(n)
                  for n in re.findall(r'(?<![A-Za-z0-9_-])\d+(?![A-Za-z0-9_-])', text or "")
              ]

          # ------------------------------------------------------------
          # LaTeX 検証
          # 方針:
          #   - 問題文の LaTeX は必須にしない
          #   - cot_solution と answer の計算式は LaTeX 必須
          # ------------------------------------------------------------
          problem_latex_required = False
          cot_latex_required = True
          answer_latex_required = True

          problem_dollar_count = count_latex_dollars(problem)
          cot_dollar_count = count_latex_dollars(cot_solution)
          answer_dollar_count = count_latex_dollars(answer)
          total_dollar_count = problem_dollar_count + cot_dollar_count + answer_dollar_count

          latex_commands = [
              r"\frac", r"\sqrt", r"\sum", r"\int", r"\lim",
              r"\sin", r"\cos", r"\tan", r"\log", r"\ln",
              r"\cdot", r"\times", r"\div",
              r"\leq", r"\geq", r"\neq", r"\infty", r"\partial",
              r"\begin", r"\end", r"\left", r"\right",
              r"\boxed", r"\text", r"\implies", r"\iff",
              r"\vec", r"\pm", r"\approx",
          ]
          found_commands = [c for c in latex_commands if c in combined_response]

          problem_latex_valid = True
          cot_has_latex = cot_dollar_count >= 2
          answer_has_latex = answer_dollar_count >= 2

          cot_latex_valid = cot_has_latex
          answer_latex_valid = answer_has_latex
          latex_valid = cot_latex_valid and answer_latex_valid

          if not cot_has_latex:
              warnings.append("解答ログに LaTeX 記法 ($...$) が見つかりません")
          elif cot_dollar_count < 4 and level_num >= 3:
              warnings.append(f"解答ログの LaTeX 式が少なすぎます ($ count: {cot_dollar_count})")

          if not answer_has_latex:
              warnings.append("回答部分に LaTeX 記法 ($...$) がありません。主要な計算式を answer に残してください")

          if total_dollar_count % 2 != 0:
              warnings.append(f"LaTeX の $ 記号数が奇数です。閉じ忘れの可能性があります ($ count: {total_dollar_count})")

          # ------------------------------------------------------------
          # 日本語・基本長さ検証
          # ------------------------------------------------------------
          cot_has_japanese = has_japanese_chars(cot_solution)
          answer_has_japanese = has_japanese_chars(answer)
          japanese_valid = cot_has_japanese and answer_has_japanese

          if len(cot_solution) < 50:
              warnings.append("解答ログが短すぎます (50文字未満)")
          if not cot_has_japanese:
              warnings.append("解答ログに日本語文字（ひらがな・漢字等）が含まれていません")
          if not answer_has_japanese:
              warnings.append("回答部分に日本語文字（ひらがな・漢字等）が含まれていません")

          answer_min_length = 55 if level_num <= 3 else 90
          if len(answer) < answer_min_length:
              warnings.append(
                  f"回答部分が短すぎます。問いへの答えとして必要な計算・条件確認・単位・結論を残してください "
                  f"(min: {answer_min_length})"
              )

          # ------------------------------------------------------------
          # 答え明示
          # ------------------------------------------------------------
          has_answer_marker = (
              "答え" in cot_solution
              or "解答" in cot_solution
              or "答え" in answer
              or "解答" in answer
              or "\\boxed" in cot_solution
              or "\\boxed" in answer
          )

          if not has_answer_marker:
              warnings.append("解答または回答に「答え」または \\boxed{} の明示がありません")

          if level_num >= 4 and "\\boxed" not in cot_solution and "\\boxed" not in answer:
              warnings.append("レベル4以上ですが、最終結論に \\boxed{} がありません")

          # ------------------------------------------------------------
          # answer のフィラー・迷い表現
          # ------------------------------------------------------------
          answer_fillers = [
              "ええと",
              "ん、",
              "たぶん",
              "おそらく",
              "多分",
              "ここで一度整理すると",
              "いや、これは",
              "迷う",
              "悩む",
              "あ、しまった",
              "今のなし",
          ]
          used_answer_fillers = [expr for expr in answer_fillers if expr in answer]
          if used_answer_fillers:
              warnings.append(
                  "回答部分にフィラー・迷い・自己修正表現が含まれています: "
                  + ", ".join(used_answer_fillers)
              )

          # ------------------------------------------------------------
          # answer の不自然な一人称定型句チェック
          # ------------------------------------------------------------
          unnatural_bokunara_patterns = [
              r"僕なら、?まず聞かれている量を?見る",
              r"僕なら、?まず条件を?見る",
              r"僕なら、?まず.*?を見るよ",
          ]
          used_unnatural_bokunara = has_regex(answer, unnatural_bokunara_patterns)
          if used_unnatural_bokunara:
              warnings.append(
                  "回答部分に『僕なら、まず〜を見るよ』型の不自然な定型句があります。"
                  "『まず注目すべき点は〜』『ここで見るべきなのは〜』『僕はここを〜と見る』などに置き換えてください"
              )

          bokunara_count = answer.count("僕なら")
          if bokunara_count >= 2:
              warnings.append(
                  "回答部分で『僕なら』が重複しています。定型句ではなく、条件確認や検算でキャラクター性を出してください"
              )

          # ------------------------------------------------------------
          # answer の根拠チェック
          # ------------------------------------------------------------
          answer_support_groups = {
              "calculation": [
                  "=",
                  "$",
                  "計算",
                  "求めると",
                  "引くと",
                  "足すと",
                  "掛けると",
                  "割ると",
                  "代入",
                  "整理すると",
              ],
              "condition": [
                  "条件",
                  "聞かれている",
                  "問われている",
                  "見るべき",
                  "比べる",
                  "差",
                  "同じ",
                  "より",
                  "以内",
                  "以上",
                  "以下",
                  "未満",
                  "超え",
                  "満た",
              ],
              "conclusion": [
                  "だから",
                  "したがって",
                  "よって",
                  "つまり",
                  "答え",
                  "結論",
                  "になる",
                  "ってこと",
              ],
              "unit_or_target": [
                  "個",
                  "本",
                  "枚",
                  "人",
                  "円",
                  "点",
                  "度",
                  "cm",
                  "m",
                  "kg",
                  "L",
                  "さつ",
                  "冊",
                  "時間",
                  "分",
                  "秒",
              ],
          }

          answer_support_score = sum(
              any(marker in answer for marker in markers)
              for markers in answer_support_groups.values()
          )
          has_answer_support = answer_support_score >= 2

          if not has_answer_support:
              warnings.append(
                  f"回答部分に計算・条件確認・結論を支える根拠が不足しています "
                  f"(answer_support_score: {answer_support_score})"
              )

          # ------------------------------------------------------------
          # answer のキャラクター性チェック
          # 語尾だけでは通さない。複数軸で判定する。
          # ------------------------------------------------------------
          answer_voice_groups = {
              "first_person_or_judgment": [
                  "僕は",
                  "僕の",
                  "僕が",
                  "僕としては",
                  "僕の確認では",
                  "僕の見方では",
                  "僕の見立て",
                  "僕の答え",
                  "僕はここを",
                  "僕はこの問題を",
                  "まず注目すべき点は",
                  "注目すべき点は",
                  "ここで見るべきなのは",
                  "ここで確認すべきなのは",
              ],
              "condition_reading": [
                  "聞かれているのは",
                  "問われているのは",
                  "まず注目すべき点は",
                  "注目すべき点は",
                  "ここで見る",
                  "ここで見るべき",
                  "見るべきなのは",
                  "条件",
                  "比べる",
                  "差",
                  "同じにする",
                  "より多い",
                  "より少ない",
                  "何を求める",
              ],
              "anti_mistake": [
                  "ではなく",
                  "じゃなく",
                  "取り違え",
                  "間違えない",
                  "片方の数ではなく",
                  "途中の量ではなく",
                  "そのまま答えるところではない",
                  "そこは違う",
              ],
              "verification": [
                  "確認",
                  "検算",
                  "たしかに",
                  "確かに",
                  "合っている",
                  "合ってる",
                  "条件にも合う",
                  "一致する",
                  "もう一度見る",
              ],
              "confident_close": [
                  "だから答えは",
                  "答えは",
                  "これで間違いない",
                  "僕の見立てで",
                  "で合っている",
                  "で合ってる",
                  "ってことさ",
                  "これでいい",
                  "これしかない",
              ],
              "boku_tone": [
                  "だね",
                  "だよ",
                  "さ。",
                  "さ、",
                  "じゃないか",
                  "と見ればいい",
                  "になるね",
                  "だったよ",
                  "だったね",
                  "なんだ",
                  "ってことさ",
                  "でしょ",
                  "ってわけ",
              ],
          }

          answer_voice_hits = {
              group: [marker for marker in markers if marker in answer]
              for group, markers in answer_voice_groups.items()
          }
          answer_voice_score = sum(1 for hits in answer_voice_hits.values() if hits)

          if style_intensity_num <= 1:
              required_voice_score = 2
          elif style_intensity_num == 2:
              required_voice_score = 3
          else:
              required_voice_score = 4

          answer_tone_valid = answer_voice_score >= required_voice_score

          # style 2 以上では、できれば一人称・判断主体を必須に近く扱う
          has_first_person_or_judgment = bool(answer_voice_hits["first_person_or_judgment"])
          if style_intensity_num >= 2 and not has_first_person_or_judgment:
              warnings.append(
                  "回答部分に一人称または自然な判断主体がありません。語尾だけでなく「まず注目すべき点は」「僕はここを〜と見る」「僕の確認では」などを自然に入れてください"
              )

          if not answer_tone_valid:
              warnings.append(
                  f"回答部分のキャラクター性が弱いです。語尾だけでなく、自然な判断主体・条件確認・検算・自信ある結論を含めてください "
                  f"(answer_voice_score: {answer_voice_score}, required: {required_voice_score})"
              )

          # 語尾だけの疑似キャラを検出
          tone_only_markers = ["だね", "だよ", "さ。", "ってことさ"]
          has_tone_suffix = any(marker in answer for marker in tone_only_markers)
          has_substantive_voice = (
              has_first_person_or_judgment
              or bool(answer_voice_hits["condition_reading"])
              or bool(answer_voice_hits["verification"])
              or bool(answer_voice_hits["anti_mistake"])
          )
          if has_tone_suffix and not has_substantive_voice:
              warnings.append("回答部分が語尾だけのキャラクター表現になっています。判断主体・条件確認・検算を追加してください")

          # ------------------------------------------------------------
          # 無人格・文体崩れチェック
          # ------------------------------------------------------------
          neutral_count = answer.count("です") + answer.count("ます")
          if neutral_count > 2:
              warnings.append("回答部分が「です・ます」調に寄りすぎています。自然な僕っ娘の口調に戻してください")

          dearu_count = answer.count("である") + answer.count("であった")
          if dearu_count > 0:
              warnings.append("回答部分に「である」調が含まれています。キャラクターの口調と合いません")

          # ------------------------------------------------------------
          # 対話シナリオ検証
          # ------------------------------------------------------------
          if interaction_type != "direct_solution" and learner_response in {"", "なし"}:
              warnings.append("対話シナリオ用の learner_response が不足しています")

          if interaction_type == "direct_solution" and learner_response != "なし":
              warnings.append("direct_solution なのに learner_response が「なし」ではありません")

          if interaction_type == "wrong_answer_correction":
              correction_markers = [
                  "違う",
                  "ではない",
                  "じゃない",
                  "ならない",
                  "条件に合わない",
                  "超えて",
                  "見落と",
                  "おかしい",
                  "だって",
                  "取り違え",
              ]
              if not any(marker in combined_response for marker in correction_markers):
                  warnings.append("誤答訂正シナリオなのに、明確な否定や条件違反の指摘が弱いです")

          elif interaction_type == "correct_answer_verification":
              verification_markers = [
                  "合って",
                  "正しい",
                  "確認",
                  "検算",
                  "確かめ",
                  "いいよ",
                  "その通り",
              ]
              if not any(marker in combined_response for marker in verification_markers):
                  warnings.append("正答確認シナリオなのに、合っていることの確認や検算が弱いです")

          elif interaction_type == "prerequisite_bridge_teaching":
              bridge_markers = [
                  "前",
                  "まず",
                  "順番",
                  "つな",
                  "大丈夫",
                  "考え方",
                  "新しい",
                  "同じ考え",
                  "ここから",
              ]
              if not any(marker in combined_response for marker in bridge_markers):
                  warnings.append("下位概念向け説明シナリオなのに、前提知識からの橋渡しが弱いです")

          # ------------------------------------------------------------
          # 知識境界チェック
          # ------------------------------------------------------------
          method_policy_warnings = []

          def inferred_forbidden_methods(level_value):
              progression = [
                  "一桁の加減、数の大小比較",
                  "二桁以上の加減、繰り上がり・繰り下がり、筆算の考え方",
                  "九九と乗法の意味",
                  "割り算、等分除、包含除、余り",
                  "小数の四則演算、位取り",
                  "分数の四則演算、通分・約分",
                  "文字式、一次方程式、正負の数",
                  "連立方程式、不等式",
                  "二次方程式、因数分解、平方根",
                  "関数、一次関数、二次関数、三角比",
                  "極限、微分係数、導関数、接線、増減表、極値",
                  "不定積分、定積分、面積、体積",
                  "行列、行列式、固有値、偏微分、重積分",
                  "群論、複素解析、位相空間、関数解析",
              ]
              current = min(max(level_value, 1), len(progression))
              return "、".join(progression[current:])

          effective_forbidden_methods = forbidden_methods or inferred_forbidden_methods(level_num)

          def concept_is_forbidden(concept_terms):
              return any(
                  term and term in effective_forbidden_methods
                  for term in concept_terms
              )

          def add_method_warning(label, concept_terms, markers=None, patterns=None):
              if not concept_is_forbidden(concept_terms):
                  return
              found = []
              if markers:
                  found.extend(has_any(combined_response, markers))
              if patterns:
                  found.extend(has_regex(combined_response, patterns))
              if found:
                  method_policy_warnings.append(
                      f"未導入の解法が使われている可能性があります ({label}: "
                      + ", ".join(found[:8])
                      + ")"
                  )

          add_method_warning(
              "乗法",
              ["乗法", "九九"],
              markers=["掛け算", "乗法", "かけ算", "倍", "\\times", "\\cdot", "×"],
          )

          add_method_warning(
              "除法",
              ["割り算", "等分除", "包含除", "余り"],
              markers=["割り算", "除法", "わり算", "\\div", "÷", "商", "余り"],
          )

          add_method_warning(
              "小数",
              ["小数"],
              markers=["小数"],
              patterns=[r"\d+\.\d+"],
          )

          add_method_warning(
              "分数",
              ["分数", "通分", "約分"],
              markers=["分数", "通分", "約分", "\\frac"],
              patterns=[r"\d+\s*/\s*\d+"],
          )

          add_method_warning(
              "文字式・一次方程式",
              ["文字式", "一次方程式", "正負の数"],
              markers=[
                  "方程式",
                  "文字式",
                  "変数",
                  "未知数",
                  "移項",
                  "両辺",
                  "x と置",
                  "xと置",
                  "x を",
                  "xを",
                  "$x",
                  "$y",
                  "$z",
                  "\\begin{cases}",
              ],
              patterns=[
                  r"[$\s（(]x\s*=",
                  r"[$\s（(]y\s*=",
                  r"[$\s（(]z\s*=",
                  r"-\d",
              ],
          )

          add_method_warning(
              "連立方程式・不等式",
              ["連立方程式", "不等式"],
              markers=["連立", "不等式", "\\leq", "\\geq", "<", ">"],
          )

          add_method_warning(
              "二次方程式・平方根・因数分解",
              ["二次方程式", "平方根", "因数分解"],
              markers=["二次方程式", "平方根", "因数分解", "\\sqrt"],
              patterns=[r"x\^2", r"\^2"],
          )

          add_method_warning(
              "関数・三角比",
              ["関数、", "一次関数", "二次関数", "三角比"],
              markers=["一次関数", "二次関数", "関数", "三角比", "\\sin", "\\cos", "\\tan"],
          )

          add_method_warning(
              "極限・微分",
              ["極限", "微分係数", "導関数", "接線", "増減表", "極値"],
              markers=["極限", "微分", "導関数", "接線", "増減表", "\\lim", "\\frac{d"],
          )

          add_method_warning(
              "積分",
              ["不定積分", "定積分", "面積", "体積"],
              markers=["積分", "不定積分", "定積分", "\\int"],
          )

          add_method_warning(
              "行列・偏微分・重積分",
              ["行列", "行列式", "固有値", "偏微分", "重積分"],
              markers=[
                  "行列",
                  "行列式",
                  "固有値",
                  "偏微分",
                  "重積分",
                  "\\partial",
                  "\\begin{pmatrix}",
              ],
          )

          add_method_warning(
              "大学専門数学",
              ["群論", "複素解析", "位相空間", "関数解析"],
              markers=[
                  "群論",
                  "留数",
                  "正則",
                  "位相",
                  "コンパクト",
                  "ノルム",
                  "バナッハ",
                  "ヒルベルト",
              ],
          )

          # ------------------------------------------------------------
          # Level 1 数値・計算範囲チェック
          # ------------------------------------------------------------
          level_numeric_warnings = []
          level_numeric_valid = True

          if level_num == 1:
              # 問題文の主要数値チェック。
              # problem だけを見るため、sample_id や level_item_index は混入しない。
              problem_nums = extract_plain_integers(problem)
              too_large_problem_nums = sorted(set(n for n in problem_nums if n >= 10))

              if too_large_problem_nums:
                  level_numeric_warnings.append(
                      "レベル1なのに問題文に二桁以上の数が現れています: "
                      + ", ".join(map(str, too_large_problem_nums))
                  )

              visible_math_text = f"{cot_solution}\\n{answer}"

              placeholder_markers = [
                  "\\square",
                  "□",
                  "? +",
                  "+ ?",
                  "? -",
                  "- ?",
                  "$x",
                  "$y",
                  "$z",
                  "x と置",
                  "xと置",
                  "x を",
                  "xを",
                  "未知数",
                  "穴埋め",
              ]
              found_placeholders = [m for m in placeholder_markers if m in visible_math_text]
              if found_placeholders:
                  level_numeric_warnings.append(
                      "レベル1で未知数・穴埋め式に近い表現が使われています: "
                      + ", ".join(found_placeholders)
                  )

              # LaTeX 内外を問わず、a + b = c / a - b = c 形式を検出。
              # 右辺は負の数も拾う。例: 3 - 5 = -2
              arithmetic_patterns = re.findall(
                  r'(\d+)\s*([+\-])\s*(\d+)\s*=\s*(-?\d+)',
                  visible_math_text
              )

              for a_raw, op, b_raw, c_raw in arithmetic_patterns:
                  a = int(a_raw)
                  b = int(b_raw)
                  c = int(c_raw)

                  if a >= 10 or b >= 10 or c >= 10:
                      level_numeric_warnings.append(
                          f"レベル1で二桁以上を含む計算が使われています: {a} {op} {b} = {c}"
                      )

                  if op == "+" and c >= 10:
                      level_numeric_warnings.append(
                          f"レベル1で繰り上がりを含む足し算が使われています: {a} + {b} = {c}"
                      )

                  if op == "-" and (a >= 10 or b >= 10):
                      level_numeric_warnings.append(
                          f"レベル1で二桁を含む引き算が使われています: {a} - {b} = {c}"
                      )

                  if op == "-" and c < 0:
                      level_numeric_warnings.append(
                          f"レベル1で負の数が出る引き算が使われています: {a} - {b} = {c}"
                      )

              # answer に LaTeX はあるが、単純な a+b=c / a-b=c 型を検出できない場合の補助警告。
              # Level 1 は計算式学習が主目的なので、式が検出できない出力は弱い可能性が高い。
              if answer_has_latex and not arithmetic_patterns:
                  level_numeric_warnings.append(
                      "レベル1ですが、解答ログまたは回答から a + b = c / a - b = c 型の計算式を検出できません"
                  )

              if level_numeric_warnings:
                  level_numeric_warnings = list(dict.fromkeys(level_numeric_warnings))
                  level_numeric_valid = False
                  warnings.extend(level_numeric_warnings)

          method_policy_valid = (not method_policy_warnings) and level_numeric_valid
          warnings.extend(method_policy_warnings)

          # ------------------------------------------------------------
          # 禁止表現チェック
          # ------------------------------------------------------------
          prohibited_expressions = [
              "僕は天才だから",
              "君には分からないだろうけど",
              "こんなの簡単すぎる",
              "馬鹿だね",
              "だぜ",
              "じゃねえか",
              "なのだ",
              "わよ",
              "わね",
          ]
          used_prohibited = [
              expr for expr in prohibited_expressions if expr in combined_response
          ]
          if used_prohibited:
              warnings.append(
                  "不適切な表現が含まれています: " + ", ".join(used_prohibited)
              )

          weak_self_praise = [
              "僕はちゃんと分かってるよ",
              "僕に任せて",
              "そこは僕がちゃんと見てるよ",
              "そこは見落とさないよ",
          ]
          used_weak_self_praise = [
              expr for expr in weak_self_praise if expr in combined_response
          ]
          if used_weak_self_praise:
              warnings.append(
                  "説明根拠の弱い自己アピール表現が含まれています: "
                  + ", ".join(used_weak_self_praise)
              )

          # ------------------------------------------------------------
          # メタ表現チェック
          # ------------------------------------------------------------
          meta_expressions = [
              "Step",
              "STEP",
              "step",
              "Level",
              "LEVEL",
              "level",
              "内部難易度",
              "使用してよい知識",
              "使ってはいけない知識",
              "禁止知識",
              "method_policy",
              "レベル制約",
              "第1段階",
              "第2段階",
              "第3段階",
          ]
          used_meta = [
              expr for expr in meta_expressions
              if expr in cot_solution or expr in answer
          ]
          meta_expression_valid = not used_meta
          if used_meta:
              warnings.append(
                  "メタ表現が解答または回答に含まれています: " + ", ".join(used_meta)
              )

          # ------------------------------------------------------------
          # 問題文の最低限チェック
          # ------------------------------------------------------------
          problem_valid = True
          if not problem:
              problem_valid = False
              warnings.append("問題文が空です")
          if not has_japanese_chars(problem):
              problem_valid = False
              warnings.append("問題文に日本語文字が含まれていません")
          if any(expr in problem for expr in meta_expressions):
              problem_valid = False
              warnings.append("問題文にメタ表現が含まれています")

          # ------------------------------------------------------------
          # 出力
          # ------------------------------------------------------------
          output = {
              "level": level_num,
              "sample_id": sample_id or "",
              "source_seed_index": source_seed_index or "",
              "level_item_index": level_item_index or "",
              "variant_index": variant_index or "",
              "grade": grade or "",
              "new_concept": new_concept or "",
              "prerequisites": prerequisites or "",
              "prerequisites_used": prereqs_used or "",
              "interaction_type": interaction_type,
              "interaction_label": interaction_label,
              "interaction_instruction": interaction_instruction or "",
              "learner_profile": learner_profile,
              "learner_response": learner_response,
              "variation_hint": variation_hint or "",
              "number_policy": number_policy or "",
              "problem_archetype": problem_archetype or "",
              "surface_theme": surface_theme or "",
              "constraint_focus": constraint_focus or "",
              "wrong_answer_pattern": wrong_answer_pattern or "",
              "diversity_instruction": diversity_instruction or "",
              "allowed_methods": allowed_methods,
              "forbidden_methods": forbidden_methods,
              "method_policy": method_policy,
              "problem": problem,
              "cot_solution": cot_solution,
              "answer": answer,
              "persona": persona,
              "style_intensity": style_intensity_num,
              "cognitive_style": cognitive_style,
              "topic": problem_topic or topic or "",
              "scenario": scenario or "",
              "problem_valid": problem_valid,
              "problem_latex_required": problem_latex_required,
              "cot_latex_required": cot_latex_required,
              "answer_latex_required": answer_latex_required,
              "problem_latex_valid": problem_latex_valid,
              "latex_valid": latex_valid,
              "cot_latex_valid": cot_latex_valid,
              "answer_latex_valid": answer_latex_valid,
              "japanese_valid": japanese_valid,
              "answer_marker_valid": has_answer_marker,
              "answer_support_valid": has_answer_support,
              "answer_support_score": answer_support_score,
              "answer_tone_valid": answer_tone_valid,
              "answer_voice_score": answer_voice_score,
              "answer_voice_required": required_voice_score,
              "answer_voice_hits": answer_voice_hits,
              "meta_expression_valid": meta_expression_valid,
              "method_policy_valid": method_policy_valid,
              "method_policy_warnings": method_policy_warnings,
              "level_numeric_valid": level_numeric_valid,
              "level_numeric_warnings": level_numeric_warnings,
              "problem_latex_dollar_count": problem_dollar_count,
              "cot_latex_dollar_count": cot_dollar_count,
              "answer_latex_dollar_count": answer_dollar_count,
              "latex_dollar_count": total_dollar_count,
              "latex_commands_found": found_commands,
              "latex_command_count": len(found_commands),
              "warnings": warnings,
              "warning_count": len(warnings),
          }

          output_topic = output["topic"]
          output_json = json.dumps(output, ensure_ascii=False, indent=2)

          ctx.log(
              "info",
              f"Lv{level_num}: cot={len(cot_solution)}chars, answer={len(answer)}chars, "
              f"latex={latex_valid}, problem_latex_required={problem_latex_required}, jp={japanese_valid}, "
              f"answer_voice={answer_voice_score}/{required_voice_score}, "
              f"level_numeric_ok={level_numeric_valid}, "
              f"meta_ok={meta_expression_valid}, method_ok={method_policy_valid}, "
              f"warn={len(warnings)}",
          )

          return {
              "OutputJSON": output_json,
              "OutputData": output,
              "Topic": output_topic,
              "Persona": persona,
              "StyleIntensity": style_intensity_num,
              "CognitiveStyle": cognitive_style,
              "ProblemValid": problem_valid,
              "LatexValid": latex_valid,
              "CoTLatexValid": cot_has_latex,
              "AnswerLatexValid": answer_has_latex,
              "JapaneseValid": japanese_valid,
              "AnswerMarkerValid": has_answer_marker,
              "AnswerSupportValid": has_answer_support,
              "AnswerSupportScore": answer_support_score,
              "AnswerToneValid": answer_tone_valid,
              "AnswerVoiceScore": answer_voice_score,
              "AnswerVoiceRequired": required_voice_score,
              "MetaExpressionValid": meta_expression_valid,
              "MethodPolicyValid": method_policy_valid,
              "LatexDollarCount": total_dollar_count,
              "CoTLatexDollarCount": cot_dollar_count,
              "AnswerLatexDollarCount": answer_dollar_count,
              "LatexCommandCount": len(found_commands),
              "Warnings": warnings,
              "WarningCount": len(warnings),
          }
    inputs:
      level: "{level}"
