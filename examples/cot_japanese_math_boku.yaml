          elif inline_dollar < 4 and level_num >= 3:
              warnings.append(f"LaTeX式が少なすぎます ($ count: {inline_dollar})")
          if len(cot_solution) < 50:
              warnings.append("解答ログが短すぎます (50文字未満)")
          if not has_japanese:
