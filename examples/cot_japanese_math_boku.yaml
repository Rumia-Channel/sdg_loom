        以下の数学の文章題を、日本語の解答ログとして解いてください。

        ═══════════════════════════════════════
        【問題】
        {Problem}
        ═══════════════════════════════════════

        【内部難易度番号】 {level}
        【新規導入概念】 {new_concept}
