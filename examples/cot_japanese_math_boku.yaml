          answer_support_markers = [
              "=",
              "$",
              "なので",
              "だから",
              "したがって",
              "よって",
              "確認",
              "条件",
              "代入",
              "計算",
              "満た",
              "超え",
              "以内",
              "以上",
              "以下",
              "単位",
              "答え",
              "結論",
          ]
          has_answer_support = any(marker in answer for marker in answer_support_markers)
          if not has_answer_support:
              warnings.append("回答部分に計算・条件確認・結論を支える根拠が不足しています")

          answer_tone_markers = [
              "僕",
              "だね",
              "だよ",
              "さ。",
              "さ、",
              "じゃないか",
              "と見ればいい",
              "になるね",
              "してみよう",
          ]
          has_answer_tone = any(marker in answer for marker in answer_tone_markers)
          has_answer_tone = has_answer_tone or answer.endswith("さ")
          if not has_answer_tone:
              warnings.append(
                  "回答部分でキャラクター口調が弱くなっています。正確さ・簡潔さと同じくらい口調維持を重視してください"
              )

          neutral_answer_markers = [
              "である",
              "です",
              "ます",
          ]
          used_neutral_answer_markers = [
              expr for expr in neutral_answer_markers if expr in answer
          ]
          if used_neutral_answer_markers:
              warnings.append(
                  "回答部分が無人格な模範解答口調に寄っています: "
                  + ", ".join(used_neutral_answer_markers)
              )

          if interaction_type != "direct_solution" and learner_response in {"", "なし"}:
              warnings.append("対話シナリオ用の learner_response が不足しています")

          combined_response = f"{learner_response}\n{cot_solution}\n{answer}"
          if interaction_type == "wrong_answer_correction":
              correction_markers = [
                  "違う",
                  "ではない",
                  "ならない",
                  "条件に合わない",
                  "超えて",
                  "見落と",
              ]
              if not any(marker in combined_response for marker in correction_markers):
                  warnings.append("誤答訂正シナリオなのに、明確な否定や条件違反の指摘が弱いです")
          elif interaction_type == "correct_answer_verification":
              verification_markers = [
                  "合って",
                  "正しい",
                  "確認",
                  "検算",
                  "確かめ",
              ]
              if not any(marker in combined_response for marker in verification_markers):
                  warnings.append("正答確認シナリオなのに、合っていることの確認や検算が弱いです")
